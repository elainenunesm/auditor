<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minhas Aulas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estudo.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%235B2BCB%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%226%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%222%22%3E%3C%2Fcircle%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%235B2BCB%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2210%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%226%22%3E%3C%2Fcircle%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%222%22%3E%3C%2Fcircle%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B2BCB">
</head>
<body>

<div class="app-wrapper">

  <!-- HEADER -->
  <header class="estudo-header">
    <button class="btn-fechar" id="btnFechar" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="header-info">
      <span class="questao-info" id="questaoInfo">Questão 1 de 5 • Aula 1: Aprenda o que é o verbo</span>
      <div class="progress-segmentos" id="progressSegmentos"></div>
    </div>
    <button type="button" class="btn-marcar-cartao" id="btnMarcarCartao" title="Marcar para revisão">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </header>

  <!-- QUESTÃO -->
  <div class="questao-wrap">
    <main class="questao-area" id="questaoArea">
      <h2 class="questao-titulo" id="questaoTitulo"></h2>
      <p class="questao-subtitulo" id="questaoSubtitulo"></p>
      <div class="opcoes" id="opcoes"></div>
    </main>
    <div class="scroll-fade" id="scrollFade"></div>
  </div>

  <!-- FEEDBACK -->
  <div class="feedback-bar" id="feedbackBar">
    <div class="feedback-icon" id="feedbackIcon"></div>
    <div class="feedback-texto" id="feedbackTexto"></div>
  </div>

  <!-- FOOTER -->
  <footer class="estudo-footer">
    <button class="btn-anterior" id="btnAnterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Anterior
    </button>
    <button class="btn-proxima" id="btnProxima">
      Próxima
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </footer>

</div>

<!-- MODAL LIÇÃO -->
<div class="licao-overlay" id="licaoOverlay">
  <div class="licao-card">
    <div class="licao-header">
      <h3 id="licaoHeader">📖 Lição</h3>
      <button class="licao-fechar" id="licaoFechar">✕</button>
    </div>
    <div class="licao-corpo" id="licaoCorpo"></div>
    <button class="licao-btn-fechar" id="licaoBtnFechar">Entendido</button>
  </div>
</div>

<!-- MODAL RESULTADO -->
<div class="resultado-overlay" id="resultadoOverlay">
  <div class="resultado-card">
    <div class="resultado-emoji" id="resultadoEmoji">🎉</div>
    <h2 class="resultado-titulo" id="resultadoTitulo">Aula concluída!</h2>
    <p class="resultado-desc" id="resultadoDesc"></p>
    <div class="resultado-estrelas" id="resultadoEstrelas"></div>
    <button class="resultado-btn-continuar" id="resultadoBtnContinuar">Voltar ao início</button>
  </div>
</div>

<script src="js/progresso.mjs"></script>
<script src="js/data/modulos.mjs"></script>
<script src="js/estudo.mjs"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
